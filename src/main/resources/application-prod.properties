# Perfil PRODUÇÃO (Hospedagem Final)
server.port=${PORT:8080}

# Banco PostgreSQL (Variáveis de ambiente)
# Se estiver usando Railway/Render/Fly.io, eles injetam a DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/condominium_prod}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Desliga logs e impede alterações estruturais no banco)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS (Aceitando localhost e o seu futuro domínio no Vercel)
# Dica: Substitua '*-username.vercel.app' pelo seu link real do Vercel depois.
app.cors.allowed-origins=http://localhost:3000,https://*.vercel.app,https://sistema-de-condominio-frontend-next.vercel.app

# Usuário mestre (DataLoader)
app.master.email=${MASTER_EMAIL}
app.master.senha=${MASTER_SENHA}
